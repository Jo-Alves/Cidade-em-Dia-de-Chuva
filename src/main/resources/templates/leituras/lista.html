<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leituras cadastradas</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header>
    <h1>Leituras cadastradas</h1>
    <nav>
        <a th:href="@{/}">Início</a> |
        <a th:href="@{/bairros}">Bairros</a> |
        <a th:href="@{/trechos}">Trechos</a>
    </nav>
</header>
<main>
<p><a class="link-acao" th:href="@{/leituras/novo}">Registrar nova leitura</a></p>

    <table>
        <thead>
        <tr>
            <th>Data e hora</th>
            <th>Trecho</th>
            <th>Lâmina (cm)</th>
            <th>Status</th>
            <th>Ações</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="leitura : ${leituras}">
            <td th:text="${#temporals.format(leitura.dataHora, 'dd/MM/yyyy HH:mm')}">01/11/2026 17:20</td>
            <td th:text="${leitura.trechoDescricao}">Rua (Bairro)</td>
            <td th:text="${leitura.laminaCm}">0</td>
            <td th:text="${leitura.status}">NORMAL</td>
            <td class="acoes">
                <a th:href="@{/leituras/{id}/editar(id=${leitura.id})}">Editar</a>
                <form th:action="@{/leituras/{id}/excluir(id=${leitura.id})}" method="post" class="form-inline" onsubmit="return confirm('Deseja excluir esta leitura?')">
                    <button type="submit" class="botao-excluir">Excluir</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(leituras)}">
            <td colspan="5">Nenhuma leitura cadastrada.</td>
        </tr>
        </tbody>
    </table>
</main>

<script th:inline="javascript">
    const mensagem = /*[[${mensagem}]]*/ null;
    if (mensagem) {
        alert(mensagem);
    }
</script>
</body>
</html>
